name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Variables globales — SQLite est fourni via le fichier versionné db/custom.db,
# aucune base externe n'est requise pour lint / typecheck / test / build.
env:
  DATABASE_URL: file:./db/custom.db
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter (oxlint + eslint)
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript compiler
        run: npm run typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

  build:
    name: Build (non-blocking)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Known issue: pre-existing Next.js 16 + Turbopack prerender failure on
    # /_global-error (TypeError: Cannot read properties of null reading
    # 'useContext'). The failure predates the Phase 0 hygiene work and will
    # be investigated in Phase 1 — see docs/PHASE_0_REPORT.md.
    # Build is run for visibility but doesn't block the pipeline until fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
